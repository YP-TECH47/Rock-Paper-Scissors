<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="main">
        <h1>Rock Paper Scissors</h1>
      </div>
    </header>
    <main>
      <div class="choises">
        <div  id="paper" class="choise">
          <img src="images/paper.png" alt="paper" />
        </div>
        <div id="rock" class="choise">
          <img src="images/rock.png" alt="rock" />
        </div>
        <div id="scissors" class="choise">
          <img src="images/scissors.png" alt="scissors" />
        </div>
      </div>
      <div class="score">
        <div class="user">
          <p id="user-result">0</p>
          <h3 class="bold">User</h3>
        </div>
        <div class="comp">
          <p id="comp-result">0</p>
          <h3 class="bold">Comp</h3>
        </div>
      </div>
      <p class="result-dec">Play The Game</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
